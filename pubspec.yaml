name: student_grades_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
 

 



  # --- مكتبات النظام والملفات ---
  path_provider: ^2.1.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  file_picker: ^10.3.8 # تأكدت من إصدار متوافق ومستقر
  open_filex: ^4.4.0
  flutter_file_dialog: ^3.0.2
  syncfusion_flutter_pdf: ^32.1.23
  syncfusion_flutter_pdfviewer: ^32.1.23
  

  
  # --- مكتبات التعامل مع البيانات ---
  bidi: ^2.0.10
  excel: ^4.0.6
  pdf: ^3.10.7
  printing: ^5.12.0
  # --- مكتبات الواجهة والرسوم ---
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  
  # --- مكتبات الجداول (مهمة للكود السابق) ---
  syncfusion_flutter_core: ^32.1.23
  syncfusion_flutter_datagrid: ^32.1.23

  # --- أدوات أخرى ---
  local_auth: ^3.0.0
  encrypt: ^5.0.0
  share_plus: ^12.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # مكتبة الأيقونات (تعريف المكتبة فقط هنا)
  flutter_launcher_icons: ^0.14.4
  
  flutter_lints: ^6.0.0

# --- قسم إعدادات Flutter ---
flutter:
  uses-material-design: true

  # الأصول (الصور والخطوط)
  assets:
    - assets/fonts/seguisb.ttf
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf
    - assets/images/school_logo.png
    - assets/images/ministry_logo.png
    - assets/images/app_icon.png
   

  # تعريف الخطوط لاستخدامها في التطبيق
  fonts:
  - family: Amiri
    fonts:
      - asset: assets/fonts/Amiri-Regular.ttf
      - asset: assets/fonts/Amiri-Bold.ttf
        weight: 700

  - family: Cairo
    fonts:
      - asset: assets/fonts/Cairo-Regular.ttf

  - family: NotoArabic
    fonts:
      - asset: assets/fonts/NotoSansArabic-Regular.ttf

# --- إعدادات أيقونة التطبيق (توضع هنا في الأسفل منفصلة) ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21



# في آخر سطر في الملف
dependency_overrides:
  archive: 3.6.1